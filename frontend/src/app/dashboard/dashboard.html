<div class="d-flex">
  <app-sidebar></app-sidebar>
  <div class="flex-grow-1">
    <div class="dashboard">
      <div class="dashboard-header">
        <div>
          <h1>Welcome back, Alex!</h1>
          <p>Here's what's happening with your projects today.</p>
        </div>

        <button class="new-task-btn" routerLink="/tasks">
          <span>+</span>
          New Task
        </button>
      </div>

      <div class="stats-container">
        <div class="stat-card total-card">
          <div class="card-top">
            <div class="icon-box total-icon">
              <span>▣</span>
            </div>
            <span class="card-badge blue-badge">+12% from last week</span>
          </div>
          <div class="card-content">
            <p>Total Tasks</p>
            <h2>{{ totalTasks }}</h2>
          </div>
        </div>

        <div class="stat-card pending-card">
          <div class="card-top">
            <div class="icon-box pending-icon">
              <span>◷</span>
            </div>
            <span class="card-badge orange-badge">Requires Attention</span>
          </div>
          <div class="card-content">
            <p>Pending</p>
            <h2>{{ pendingTasks }}</h2>
          </div>
        </div>

        <div class="stat-card completed-card">
          <div class="card-top">
            <div class="icon-box completed-icon">
              <span>✓</span>
            </div>
            <span class="card-badge gray-badge">On track</span>
          </div>
          <div class="card-content">
            <p>Completed</p>
            <h2>{{ completedTasks }}</h2>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
