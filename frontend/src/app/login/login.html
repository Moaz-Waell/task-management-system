<app-navbar></app-navbar>
<div
  class="d-flex flex-column align-items-center justify-content-center"
  style="min-height: calc(100vh - 64px); background-color: #f2f3ff"
>
  <div class="card shadow-sm border" style="max-width: 448px; width: 100%; border-radius: 12px">
    <div class="card-body p-4">
      <h1 class="text-center fw-bold mb-1" style="font-size: 32px; color: #191b24">Login</h1>
      <p class="text-center mb-4" style="color: #424655">Welcome back to TaskMaster</p>

      <form [formGroup]="loginform" (ngSubmit)="login()">
        <div class="mb-3">
          <label class="form-label fw-semibold">Email Address</label>
          <input
            type="email"
            class="form-control"
            placeholder="Your Email Address"
            formControlName="email"
            [class.is-invalid]="loginform.get('email')?.invalid && loginform.get('email')?.touched"
          />
          <div
            class="invalid-feedback"
            *ngIf="loginform.get('email')?.invalid && loginform.get('email')?.touched"
          >
            <div *ngIf="loginform.get('email')?.errors?.['required']">Email is required.</div>
            <div *ngIf="loginform.get('email')?.errors?.['email']">
              Enter a valid email address.
            </div>
          </div>
        </div>

        <div class="mb-4">
          <div class="d-flex justify-content-between">
            <label class="form-label fw-semibold">Password</label>
          </div>
          <div class="position-relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              class="form-control pe-5"
              placeholder="••••••••"
              formControlName="password"
              [class.is-invalid]="
                loginform.get('password')?.invalid && loginform.get('password')?.touched
              "
            />
            <button
              type="button"
              class="btn position-absolute top-50 end-0 translate-middle-y me-2 p-0 border-0 bg-transparent text-muted"
              (click)="togglePassword()"
              tabindex="-1"
            >
              <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
            </button>
          </div>
          <div
            class="text-danger small mt-1"
            *ngIf="loginform.get('password')?.invalid && loginform.get('password')?.touched"
          >
            <div *ngIf="loginform.get('password')?.errors?.['required']">Password is required.</div>
          </div>
        </div>

        <div class="alert alert-danger py-2 mt-3" *ngIf="loginError">
          Invalid email or password.
        </div>

        <button
          type="submit"
          class="btn w-100 mt-3 text-white fw-semibold"
          style="background-color: #0057cd"
          [disabled]="loginform.invalid"
        >
          Sign In &rarr;
        </button>
      </form>

      <p class="text-center mt-4 mb-0">
        Don't have an account?
        <a routerLink="/register" class="fw-semibold" style="color: #0057cd">Register</a>
      </p>
    </div>
  </div>
</div>
