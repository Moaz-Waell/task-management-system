<div class="min-vh-100" style="background-color: #f2f3ff">
  <app-navbar></app-navbar>
  <div class="d-flex justify-content-center pt-5">
    <div class="card shadow-sm border" style="max-width: 448px; width: 100%; border-radius: 12px">
      <div class="card-body p-4">
        <h1 class="text-center fw-bold mb-1" style="font-size: 32px; color: #191b24">Register</h1>
        <p class="text-center mb-4" style="color: #424655">
          Create an account to start managing your tasks efficiently.
        </p>

        <form #registerform="ngForm" (ngSubmit)="save(registerform)">
          <div class="mb-3">
            <label class="form-label fw-semibold">Full Name</label>
            <input
              type="text"
              class="form-control"
              placeholder="Your Name"
              name="name"
              required
              minlength="3"
              #name="ngModel"
              [(ngModel)]="user.name"
            />
            <div class="text-danger small mt-1" *ngIf="name.invalid && name.touched">
              <div *ngIf="name.errors?.['required']">Full name is required.</div>
              <div *ngIf="name.errors?.['minlength']">Name must be at least 3 characters.</div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <input
              type="email"
              class="form-control"
              placeholder="Your Email Address"
              name="email"
              required
              email
              #email="ngModel"
              [(ngModel)]="user.email"
            />
            <div class="text-danger small mt-1" *ngIf="email.invalid && email.touched">
              <div *ngIf="email.errors?.['required']">Email is required.</div>
              <div *ngIf="email.errors?.['email']">Enter a valid email address.</div>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <div class="position-relative">
              <input
                [type]="showPassword ? 'text' : 'password'"
                class="form-control pe-5"
                placeholder="••••••••"
                name="password"
                required
                minlength="8"
                #password="ngModel"
                [(ngModel)]="user.password"
              />
              <button
                type="button"
                class="btn position-absolute top-50 end-0 translate-middle-y me-2 p-0 border-0 bg-transparent text-muted"
                (click)="togglePassword()"
                tabindex="-1"
              >
                <i
                  class="bi"
                  [class.bi-eye]="!showPassword"
                  [class.bi-eye-slash]="showPassword"
                ></i>
              </button>
            </div>
            <div class="text-danger small mt-1" *ngIf="password.invalid && password.touched">
              <div *ngIf="password.errors?.['required']">Password is required.</div>
              <div *ngIf="password.errors?.['minlength']">Must be at least 8 characters long.</div>
            </div>
          </div>

          <button
            type="submit"
            class="btn w-100 text-white fw-semibold"
            style="background-color: #0057cd"
            [disabled]="registerform.invalid"
          >
            Register
          </button>
        </form>

        <p class="text-center mt-4 mb-0">
          Already have an account?
          <a routerLink="/login" class="fw-semibold" style="color: #0057cd">Login</a>
        </p>
      </div>
    </div>
  </div>
</div>
